[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "djset"
version = "0.1.0"
description = "Personal Spotify playlist & DJ set generator (single-user, local-only)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "keyring>=25.0",
    "PySide6>=6.7",
    # Verify TLS against the OS trust store, so antivirus/proxy HTTPS
    # interception does not break every request. See djset.net._ssl_context.
    "truststore>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[project.scripts]
djset = "djset.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
djset = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
